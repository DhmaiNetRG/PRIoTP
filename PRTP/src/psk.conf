# PRIoTPS Pre-Shared Key Configuration File
#
# Format (one entry per line):
#   <key_id>  <32-hex-char-key>  [default]
#
# Fields:
#   key_id   : Integer 0-255. Identifies the key slot.
#   hex_key  : Exactly 32 hex characters (16 bytes = 128 bits).
#               Both upper and lower case are accepted.
#   default  : Optional. Marks this key as the default for outgoing packets.
#               If no entry is marked default, slot 0 is used.
#
# Rules:
#   - Lines starting with '#' are comments and are ignored.
#   - Blank lines are ignored.
#   - Duplicate key_id entries: the last one wins.
#   - Key material should be generated with a CSPRNG (e.g., /dev/urandom).
#
# Security notes:
#   - This file should have permissions 0600 (owner read/write only).
#   - Keys MUST be rotated before seq_no wraps (every ~65k packets).
#   - Use key_id 0 as the primary key and key_id 1 as the rotation key.
#
# Generate a 128-bit key with:
#   dd if=/dev/urandom bs=16 count=1 2>/dev/null | xxd -p -c 16
#
# ─────────────────────────────────────────────────────────────────────────────
# key_id   hex_key (32 hex chars = 128 bits)      [default]
# ─────────────────────────────────────────────────────────────────────────────

# Primary key (REPLACE before deployment)
0    0102030405060708090a0b0c0d0e0f10    default

# Rotation key — pre-load before signalling KEYREQ (REPLACE before deployment)
1    aabbccddeeff00112233445566778899
